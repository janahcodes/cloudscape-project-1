<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 1.2; rx: 6; }
      .svc { fill: #fff7e6; stroke: #d97706; stroke-width: 1.2; }
      .ctr { fill: #e8f1ff; stroke: #2563eb; stroke-width: 1.2; }
      .ttl { font-weight: bold; font-size: 13px; }
      .sub { fill: #555; font-size: 11px; }
      .lbl { fill: #111; font-size: 11px; }
      .line { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <!-- AWS cloud boundary -->
  <rect x="200" y="55" width="745" height="510" rx="10" fill="#fafafa" stroke="#232f3e" stroke-width="1.5"/>
  <text x="933" y="74" text-anchor="end" class="ttl" fill="#232f3e">AWS Cloud</text>

  <!-- Region -->
  <rect x="215" y="150" width="715" height="370" rx="8" fill="none" stroke="#2e7d32" stroke-width="1.2" class="dash"/>
  <text x="225" y="166" class="sub" fill="#2e7d32">Region us-east-2</text>

  <!-- VPC -->
  <rect x="230" y="175" width="405" height="330" rx="8" fill="#f2fbf2" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="240" y="192" class="ttl" fill="#2e7d32">Default VPC</text>

  <!-- Public subnet -->
  <rect x="330" y="205" width="290" height="285" rx="6" fill="#e3f5e3" stroke="#43a047"/>
  <text x="340" y="222" class="sub">Default public subnet</text>

  <!-- Security group -->
  <rect x="345" y="232" width="260" height="200" rx="6" fill="none" stroke="#c62828" stroke-width="1.2" class="dash"/>
  <text x="352" y="246" class="sub" fill="#c62828">Security group: in 80, 443 only</text>

  <!-- EC2 -->
  <rect x="358" y="255" width="234" height="165" rx="6" class="svc"/>
  <text x="368" y="272" class="ttl">EC2 t3.micro (Amazon Linux 2023)</text>
  <text x="368" y="287" class="sub">public IPv4 · set up by user_data</text>
  <rect x="372" y="298" width="96" height="58" rx="5" class="ctr"/>
  <text x="420" y="320" text-anchor="middle" class="ttl">Caddy</text>
  <text x="420" y="336" text-anchor="middle" class="sub">:443 TLS</text>
  <text x="420" y="349" text-anchor="middle" class="sub">:80 → redirect</text>
  <rect x="484" y="298" width="96" height="58" rx="5" class="ctr"/>
  <text x="532" y="320" text-anchor="middle" class="ttl">App</text>
  <text x="532" y="336" text-anchor="middle" class="sub">FastAPI :8000</text>
  <text x="532" y="349" text-anchor="middle" class="sub">systemd service</text>
  <rect x="372" y="370" width="208" height="38" rx="5" fill="#fdecea" stroke="#c62828"/>
  <text x="476" y="386" text-anchor="middle" class="ttl" fill="#c62828">IAM instance role</text>
  <text x="476" y="400" text-anchor="middle" class="sub">S3 rooms/* in one bucket only</text>

  <!-- IGW -->
  <rect x="242" y="255" width="72" height="42" rx="5" class="box"/>
  <text x="278" y="280" text-anchor="middle" class="ttl">IGW</text>

  <!-- Route 53 (global) -->
  <rect x="230" y="75" width="190" height="58" rx="6" class="svc"/>
  <text x="325" y="98" text-anchor="middle" class="ttl">Route 53</text>
  <text x="325" y="114" text-anchor="middle" class="sub">A app.cloudscape.lol → EC2 IP</text>
  
  <!-- Regional managed services -->
  <rect x="665" y="180" width="250" height="62" rx="6" class="svc"/>
  <text x="790" y="203" text-anchor="middle" class="ttl">S3 bucket (files)</text>
  <text x="790" y="219" text-anchor="middle" class="sub">private · files under rooms/CODE/</text>
  <text x="790" y="233" text-anchor="middle" class="sub">SSE-S3 · lifecycle: delete after 1 day</text>


  <!-- External actors -->
  <rect x="20" y="240" width="140" height="70" rx="6" class="box"/>
  <text x="90" y="268" text-anchor="middle" class="ttl">User</text>
  <text x="90" y="285" text-anchor="middle" class="sub">phone + laptop</text>

  <rect x="20" y="430" width="140" height="56" rx="6" class="box"/>
  <text x="90" y="454" text-anchor="middle" class="ttl">Let's Encrypt</text>
  <text x="90" y="470" text-anchor="middle" class="sub">ACME CA</text>

  <rect x="20" y="345" width="140" height="56" rx="6" class="box"/>
  <text x="90" y="369" text-anchor="middle" class="ttl">Developer</text>
  <text x="90" y="385" text-anchor="middle" class="sub">terraform apply</text>

  <!-- Flows -->
  <!-- 1 DNS -->
  <path class="line" d="M160,250 L228,122"/>
  <text x="200" y="200" class="lbl">①</text>
  <!-- 2 HTTPS to IGW then Caddy -->
  <path class="line" d="M160,276 L240,276"/>
  <text x="176" y="270" class="lbl">②</text>
  <path class="line" d="M314,276 C340,276 345,327 370,327"/>
  <!-- 3 Caddy -> App -->
  <path class="line" d="M468,327 L482,327"/>
  <!-- 4 App -> S3 -->
  <path class="line" d="M580,310 C620,300 630,215 663,212"/>
  <text x="628" y="272" class="lbl">③</text>
  <!-- 5 presigned download direct to S3 -->
  <path class="line dash" d="M90,240 L90,40 L790,40 L790,178"/>
  <text x="470" y="34" text-anchor="middle" class="lbl">④ Downloads and photo previews come straight from S3, using a private link that expires in 5 minutes</text>
  <!-- ACME -->
  <path class="line dash" d="M420,420 L420,537 L90,537 L90,488"/>
  <text x="250" y="553" class="sub">ACME HTTP-01 challenge · cert issue + renew</text>
  <!-- Developer -->
  <path class="line dash" d="M160,373 L212,373"/>
  <text x="168" y="365" class="sub">API</text>

  <!-- Legend -->
  <text x="665" y="448" class="ttl">How it works</text>
  <text x="665" y="466" class="sub">① Your device finds the site in Route 53</text>
  <text x="665" y="481" class="sub">② It connects to the server over HTTPS</text>
  <text x="665" y="496" class="sub">③ The app saves and reads files in S3</text>
  <text x="665" y="511" class="sub">④ Files download straight from S3</text>
</svg>
